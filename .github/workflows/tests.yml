name: CPU checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Run offline CPU tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax and command previews
        run: |
          python -m compileall -q src tests scripts run_pipeline.py
          bash -n slurm/run.sh
          python run_pipeline.py --config configs/fullrank.yaml --end-gen 1 --dry-run
          python run_pipeline.py --config configs/qlora.yaml --end-gen 1 --dry-run
          python run_pipeline.py --config configs/smoke.yaml --dry-run
