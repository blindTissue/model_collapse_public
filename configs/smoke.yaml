# Single-model generation-0 GPU smoke test: eight training examples.
model:
  dtype: bfloat16
models:
- name: meta-llama/Llama-3.2-1B
  short_name: llama
dataset:
  name: allenai/c4
  config: en
  train_size: 8
  val_size: 2
  test_size: 4
  seed: 42
  min_chars: 1000
training:
  num_epochs: 1
  per_device_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-05
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_seq_length: 128
  gradient_checkpointing: false
  bf16: true
  save_strategy: 'no'
  logging_steps: 1
  weight_decay: 0.01
  max_grad_norm: 1.0
  torch_compile: false
  attn_implementation: sdpa
generation:
  num_continuations: 4
  prompt_length: 32
  max_new_tokens: 32
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.2
  vllm_tensor_parallel: 1
  vllm_gpu_memory_utilization: 0.25
  generation_batch_size: 4
  vllm_max_model_len: 128
collapse:
  num_generations: 0
paths:
  output_dir: outputs
  data_dir: data
  models_dir: models
  results_dir: results
