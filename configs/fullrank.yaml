model:
  dtype: "bfloat16"

models:
  - name: "meta-llama/Llama-3.2-1B"
    short_name: "llama"
  - name: "google/gemma-3-1b-pt"
    short_name: "gemma"
  - name: "Qwen/Qwen2.5-1.5B"
    short_name: "qwen"

dataset:
  name: "allenai/c4"
  config: "en"
  train_size: 200000
  val_size: 10000
  test_size: 10000
  seed: 42

training:
  num_epochs: 1
  per_device_batch_size: 20
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 512
  gradient_checkpointing: false
  bf16: true
  save_strategy: "epoch"
  logging_steps: 50
  weight_decay: 0.01
  max_grad_norm: 1.0
  torch_compile: true
  attn_implementation: "sdpa"

generation:
  num_continuations: 20000
  prompt_length: 64
  max_new_tokens: 448
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.2
  vllm_tensor_parallel: 1
  vllm_gpu_memory_utilization: 0.90

collapse:
  num_generations: 9

paths:
  output_dir: "outputs"
  data_dir: "data"
  models_dir: "models"
  results_dir: "results"
